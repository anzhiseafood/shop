    <style>
        /* 統一配色與字體 */
        body { 
            background-color: #FDF9F3; 
            color: #333; 
            font-family: 'Cairo', 'Microsoft JhengHei', sans-serif; 
            position: relative;
            overflow-x: hidden;
        }

        /* 動畫背景層 */
        .animation-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        @keyframes float-animation {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-40px) rotate(10deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        .floating-icon {
            position: absolute;
            opacity: 0.2;
            color: #d2b48c;
            animation: float-animation 12s infinite ease-in-out;
        }
        
        .header { 
            background-color: rgba(253, 245, 230, 0.95) !important; 
            border-bottom: 1px solid #E5D9C3; 
            position: sticky; 
            top: 0; 
            z-index: 1100; 
            padding: 12px 0;
            backdrop-filter: blur(10px);
        }
        .navbar { padding: 0; }
        .navbar-brand img { max-height: 38px; }
        .navbar-toggler { border: none; padding: 10px; color: #5D4037; }
        
        .nav-link { 
            color: #5D4037 !important; 
            font-size: 16px; 
            font-weight: 600;
            padding: 10px 20px !important;
            transition: 0.3s;
        }
        .nav-link:hover, .nav-item.active .nav-link { color: #8B7355 !important; }

        @media (max-width: 991px) {
            .navbar-collapse {
                background-color: #FDF5E6;
                border-top: 1px solid #E5D9C3;
                margin-top: 10px;
                text-align: center;
                border-radius: 8px;
            }
        }
        
        /* 聯絡資訊區塊樣式 */
        .contact-box {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #E5D9C3;
            box-shadow: 0 4px 15px rgba(93, 64, 55, 0.05);
            text-align: center;
            margin-bottom: 30px;
            transition: 0.3s;
            height: 100%;
        }
        .contact-box:hover { transform: translateY(-5px); }
        .contact-icon { font-size: 45px; margin-bottom: 20px; }
        
        .color-line { color: #06C755; }

        .btn-contact {
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            display: inline-block;
            text-decoration: none;
            color: white !important;
            margin-top: 15px;
            transition: 0.3s;
        }
        .btn-contact:hover { transform: translateY(-2px); }
    </style>

</head>
